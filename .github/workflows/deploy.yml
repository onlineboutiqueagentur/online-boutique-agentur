# Jede Änderung auf main geht automatisch live (Cloudflare Pages, Produktions-Branch „live“).
# Andere Branches bekommen nur eine eigene Vorschau-Adresse.
name: Deploy

on:
  push:

# Nie zwei Uploads gleichzeitig: sonst könnte ein älterer Stand einen neueren überschreiben
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler pages deploy dist --project-name online-boutique-agentur --branch "$ZIEL"
        env:
          # main → live (Produktion), alles andere → Vorschau unter dem Branch-Namen
          ZIEL: ${{ github.ref_name == 'main' && 'live' || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
